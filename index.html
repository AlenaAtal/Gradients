<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient</title>

    <style>
        body{
            background-color: lightblue;
        }

        p{
            font-size: 40px;
            color: #00FF00;
            background: linear-gradient(red, orange, yellow, green, blue, indigo, violet);
            text-align: center;
        }

        div{
            width: 300px;
            height: 300px;
            margin: 20px;
            float: left;
        }
    </style>
</head>
<body>

    <p>Градієнти</p>

    <div class="box" style="background: linear-gradient(yellow, blue);"></div>
    <div class="box" style="background: linear-gradient(to right, yellow, blue);"></div>
    <div class="box" style="background: linear-gradient(45deg, yellow, blue);"></div>
    <div class="box" style="background: linear-gradient(135deg, yellow, blue);"></div>
    <div class="box" style="background: linear-gradient(225deg, yellow, blue);"></div>
    <div class="box" style="background: linear-gradient(#ff0, #00f);"></div>
    <div class="box" style="background: linear-gradient(45deg, yellow 50%, blue 50%);"></div>
    <div class="box" style="background: linear-gradient(360deg, yellow 50%, blue 50%); width: 400px;"></div>
    <div class="box" style="background: linear-gradient(green 25%, yellow 50%, blue 75%, red);"></div>
    <div class="box" style="background: linear-gradient(green 0 25%, yellow 25% 50%, blue 50% 75%, red 75%); width: 400px;"></div>

    <div class="box" style="background: radial-gradient(yellow, blue);"></div>
    <div class="box" style="background: radial-gradient(yellow 30%, blue);"></div>
    <div class="box" style="background: radial-gradient(circle at 75px 75px, yellow 30%, blue);"></div>
    <div class="box" style="background: radial-gradient(circle at 225px 75px, yellow 30%, blue);"></div>
    <div class="box" style="background: radial-gradient(circle at 0px 150px, yellow 30%, blue);"></div>
    <div class="box" style="background: radial-gradient(yellow 30%, blue 70%); border-radius: 25%;"></div>
    <div class="box" style="background: radial-gradient(yellow 30%, blue 70%); border-radius: 50%;"></div>
    <div class="box" style="background: radial-gradient(yellow 30%, blue 30%); border-radius: 50%;"></div>

    <div class="box" style="background: conic-gradient(yellow, blue);"></div>
    <div class="box" style="background: conic-gradient(yellow, blue, orange, green);"></div>
    <div class="box" style="background: conic-gradient(from 45deg, yellow, blue, orange, green);"></div>
    <div class="box" style="background: conic-gradient(at 225px 225px, yellow, blue, orange, green);"></div>
    <div class="box" style="background: conic-gradient(green 0% 25%, yellow 25% 50%, blue 50% 75%, red 75%); border-radius: 50%;"></div>

    <div class="box" style="background: repeating-linear-gradient(yellow 10%, blue 20%);"></div>
    <div class="box" style="background: repeating-linear-gradient(yellow 0 10%, blue 10% 20%);"></div>

    <div class="box" style="background: repeating-radial-gradient(yellow 0 10%, blue 10% 30%);"></div>
    <div class="box" style="background: repeating-radial-gradient(yellow 10%, blue 20%);"></div>

    <div class="box" style="background: repeating-conic-gradient(yellow 5%, blue 10%, orange 15%, green 20%);"></div>
    <div class="box" style="background: repeating-conic-gradient(yellow 0% 5%, blue 5% 10%, orange 10% 15%, green 15% 20%); border-radius: 50%;"></div>
</body>
</html>
